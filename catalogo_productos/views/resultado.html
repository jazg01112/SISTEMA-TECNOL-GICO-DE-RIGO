<h2>Resultado de búsqueda</h2>
$if producto:
    <p><strong>ID:</strong> $producto[0]</p>
    <p><strong>Nombre:</strong> $producto[1]</p>
    <p><strong>Categoría:</strong> $producto[2]</p>
    <p><strong>Marca:</strong> $producto[3]</p>
    <p><strong>Precio:</strong> $$("%.2f" % producto[4])</p>
    <p><strong>Existencia:</strong> $producto[5]</p>
$else:
    <p>$mensaje</p>
<p><a href="/">Regresar al catálogo</a></p>
