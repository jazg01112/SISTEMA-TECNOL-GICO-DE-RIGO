$def with (productos, mensaje)
<h2>Catálogo de productos</h2>
<p><a href="/nuevo">Registrar producto</a></p>

<h3>Buscar producto por ID</h3>
<form method="GET" action="/buscar">
    <label>ID del producto:</label>
    <input type="number" name="id" required>
    <button type="submit">Buscar</button>
</form>

<h3>Productos (recorrido inorden)</h3>
$if productos:
    <table border="1" cellpadding="5">
        <tr>
            <th>ID</th><th>Nombre</th><th>Categoría</th>
            <th>Marca</th><th>Precio</th><th>Existencia</th><th>Acción</th>
        </tr>
        $for p in productos:
            <tr>
                <td>$p[0]</td>
                <td>$p[1]</td>
                <td>$p[2]</td>
                <td>$p[3]</td>
                <td>$p[4]</td>
                <td>$p[5]</td>
                <td>
                    <form method="POST" action="/eliminar">
                        <input type="hidden" name="id" value="$p[0]">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
$else:
    <p>No hay productos registrados.</p>
